<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Earth Jukebox · NASA Space Apps 2026</title>
</head>
<body>
  <header>
    <div><h1>🌍 Earth Jukebox</h1><p>Listen to what NASA satellites see.</p></div>
    <span id="stac" class="badge">VEDA STAC: checking…</span>
  </header>
  <main>
    <div id="map-wrap"><div id="map" aria-label="Interactive Earth map"></div><div id="scan" hidden></div></div>
    <aside aria-label="Controls">
      <button id="play" aria-pressed="false">▶ Play scan</button>
      <label>Mode
        <select id="mode"><option value="scan">Scan (left → right)</option><option value="cursor">Cursor (click map, then hover)</option></select>
      </label>
      <label>Science layer <select id="layer"></select></label>
      <label>Date <input type="date" id="date" /></label>
      <label>Scale
        <select id="scale">
          <option value="pentatonic">Pentatonic (calm)</option><option value="dorian">Dorian (reflective)</option>
          <option value="aeolian">Aeolian (somber)</option><option value="chromatic">Chromatic (analytical)</option>
        </select>
      </label>
      <label>Scan speed <input type="range" id="speed" min="2" max="20" value="8" /></label>
      <label>Volume <input type="range" id="volume" min="0" max="1" step="0.05" value="0.6" /></label>
      <h2>Stories</h2>
      <div id="stories"></div>
      <label>Output peak (AudioWorklet limiter) <meter id="peak" min="0" max="1" low="0.7" high="0.9" value="0"></meter></label>
      <canvas id="viz" width="300" height="60" aria-hidden="true"></canvas>
      <p id="status" class="status">Loading…</p>
    </aside>
  </main>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <footer>Imagery: NASA GIBS · Data catalogue: NASA VEDA · Audio: Tone.js</footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
